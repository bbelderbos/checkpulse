<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>checkpulse · all sites</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 2rem; max-width: 720px; margin-inline: auto; }
    h1 { font-size: 1.2rem; margin: 0 0 .25rem; }
    .sub { color: #6b7280; margin: 0 0 1.5rem; }
    .periods a { margin-right: .5rem; text-decoration: none; padding: .25rem .6rem; border-radius: 6px; border: 1px solid #d1d5db; color: inherit; }
    .periods a.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; }
    th { text-align: left; font-size: .8rem; color: #6b7280; font-weight: 600; padding: .3rem 0; border-bottom: 1px solid #e5e7eb; }
    th.c, td.c { text-align: right; }
    td { padding: .55rem 0; border-bottom: 1px solid #f0f0f0; font-variant-numeric: tabular-nums; }
    td.c { color: #6b7280; }
    td a { text-decoration: none; color: inherit; font-weight: 500; }
    td a:hover { color: #2563eb; }
    .empty { color: #9ca3af; font-style: italic; }
  </style>
</head>
<body>
  <h1>checkpulse</h1>
  <p class="sub">all sites</p>

  <div class="periods">
    <a href="?period=today" class="{% if period == "today" %}active{% endif %}">Today</a>
    <a href="?period=7d" class="{% if period == "7d" %}active{% endif %}">7 days</a>
    <a href="?period=30d" class="{% if period == "30d" %}active{% endif %}">30 days</a>
  </div>

  {% if rows.is_empty() %}<p class="empty">No sites configured.</p>{% else %}
  <table>
    <tr><th>Site</th><th class="c">Page views</th><th class="c">Unique visitors</th></tr>
    {% for row in rows %}
    <tr>
      <td><a href="?site={{ row.site_id }}&period={{ period }}">{{ row.site_id }} →</a></td>
      <td class="c">{{ row.total_views }}</td>
      <td class="c">{{ row.unique_visitors }}</td>
    </tr>
    {% endfor %}
  </table>
  {% endif %}
</body>
</html>
